<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#11142b" />
    <meta name="color-scheme" content="dark" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kart Blitz" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Kart Blitz</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ff3b3b'/%3E%3Cpath d='M18 44h28l-4-14H22z' fill='%23ffd23f'/%3E%3Ccircle cx='22' cy='46' r='6' fill='%23222'/%3E%3Ccircle cx='42' cy='46' r='6' fill='%23222'/%3E%3C/svg%3E"
    />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d1c; overscroll-behavior: none; touch-action: none; }
      /* Touch: no double-tap/pinch zoom, no long-press callout/selection. Scrollable UI lists must opt back in with
         their own `touch-action: pan-y` (a scroll container's own value wins over html/body). */
      body { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; -webkit-text-size-adjust: 100%; }
      #app { position: fixed; inset: 0; touch-action: none; }
      #app canvas { display: block; width: 100%; height: 100%; }
      /* UI overlay root. pointer-events are opted into per element by the UI. */
      #ui { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="ui"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
