<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Visuals FX</title>
<style>
html,body{margin:0;height:100%;background:#1b1f3a;overflow:hidden;font:12px monospace}
canvas{display:block}
#ui{position:fixed;left:8px;top:8px;display:flex;flex-wrap:wrap;gap:4px;max-width:70vw}

</head>
<body>
<div id="ui"></div>
<div id="info"></div>
<script type="module" src="./fx.js"></script>

</html>
