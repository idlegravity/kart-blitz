<!doctype html>
<html><head><meta charset="utf-8" /><title>Showroom</title>
<style>html,body{margin:0;height:100%;background:#0b0f2e;overflow:hidden;font:12px monospace}canvas{display:block}
#ui{position:fixed;left:8px;bottom:8px;display:flex;flex-wrap:wrap;gap:4px;max-width:90vw}
#ui button{font:11px monospace;padding:3px 6px;background:#223;color:#fff;border:1px solid #556;border-radius:4px;cursor:pointer}
#info{position:fixed;right:8px;top:8px;color:#fff;white-space:pre;text-shadow:0 1px 2px #000}
#mock{position:fixed;inset:0;pointer-events:none}
#mock .panel{position:absolute;left:3%;top:12%;width:34%;height:70%;border:1px dashed rgba(255,255,255,.25);border-radius:12px;color:#ffffff66;padding:8px;display:none}
#mock .logo{position:absolute;left:25%;top:2%;width:50%;height:22%;border:1px dashed rgba(255,255,255,.25);border-radius:12px;color:#ffffff66;padding:8px;display:none}
</style></head>
<body>
<div id="mock"><div class="panel">UI panel</div><div class="logo">logo</div></div>
<div id="ui"></div><div id="info"></div>
<script type="module" src="./showroom.js"></script>
</body></html>
