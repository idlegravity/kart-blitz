<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>World viewer</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; }
  #hud { position: fixed; left: 8px; top: 8px; font: 12px/1.4 ui-monospace, Menlo, monospace; color: #0f0; background: rgba(0,0,0,.55); padding: 6px 8px; border-radius: 6px; white-space: pre; pointer-events: none; }
  #bar { position: fixed; right: 8px; top: 8px; display: flex; gap: 4px; flex-wrap: wrap; max-width: 60vw; justify-content: flex-end; font: 12px ui-monospace, Menlo, monospace; }
  #bar button, #bar select { font: inherit; color: #cfe; background: rgba(0,0,0,.6); border: 1px solid #345; border-radius: 6px; padding: 3px 8px; cursor: pointer; }
  #bar button.on { background: #1d6; color: #012; border-color: #1d6; }
  #help { position: fixed; left: 8px; bottom: 8px; font: 11px ui-monospace, Menlo, monospace; color: #9ab; background: rgba(0,0,0,.45); padding: 4px 8px; border-radius: 6px; }
</style>
</head>
<body>
<div id="hud"></div>
<div id="bar"></div>
<div id="help">1-4 track | O orbit | F fly (WASD/RF, drag to look) | V overview | D drive-along | Space pause | [ ] speed | Z quality</div>
<script type="module" src="./viewer.js"></script>
</body>
</html>
