<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Kart Blitz — item meshes</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b0d1c; overflow: hidden; }
      canvas { display: block; width: 100%; height: 100%; }
      #label { position: fixed; left: 12px; top: 10px; font: 13px/1.4 ui-monospace, Menlo, monospace; color: #cde; text-shadow: 0 1px 2px #000; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="label"></div>
    <script type="module">
      // Vite only pre-bundles deps reachable from index.html; dev-page-only addons get discovered late and the first
      // load can fail with "Outdated Optimize Dep" (HMR is off in snap.mjs). Retry after a reload.
      const tries = Number(sessionStorage.getItem('gp-tries') || 0);
      try {
        await import('./items.js');
      } catch (e) {
        console.warn('dev page import failed, retrying', e);
        if (tries < 4) {
          sessionStorage.setItem('gp-tries', String(tries + 1));
          setTimeout(() => location.reload(), 2500);
        } else throw e;
      }
    </script>
  </body>
</html>
